<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Behaviour Vision Lab — Compare runs</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="compare.css">
</head>
<body>
<div id="compare-app">

  <header class="top-bar">
    <div class="top-bar-left">
      <svg class="app-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M3 7l9 5 9-5M12 12v10" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span class="app-name">Compare runs</span>
    </div>
    <div class="top-bar-right">
      <span class="status-item" id="compare-status">Load up to 4 videos, then press Play — they stay in sync.</span>
    </div>
  </header>

  <!-- 2x2 grid: each cell is independent until a file is loaded into it
       (see compare.js), so 1, 2, 3 or 4 videos are all valid -- the sync
       engine only ever looks at the SLOTS THAT ARE ACTUALLY LOADED. -->
  <div class="compare-grid">
    <div class="compare-cell" id="cell-0">
      <div class="compare-cell-header">
        <span class="compare-cell-label">Video 1</span>
        <button class="btn btn-outline btn-sm" data-slot="0">Load video…</button>
      </div>
      <div class="compare-video-wrap">
        <video id="video-0" muted playsinline></video>
        <div class="compare-video-placeholder">No video loaded</div>
      </div>
    </div>
    <div class="compare-cell" id="cell-1">
      <div class="compare-cell-header">
        <span class="compare-cell-label">Video 2</span>
        <button class="btn btn-outline btn-sm" data-slot="1">Load video…</button>
      </div>
      <div class="compare-video-wrap">
        <video id="video-1" muted playsinline></video>
        <div class="compare-video-placeholder">No video loaded</div>
      </div>
    </div>
    <div class="compare-cell" id="cell-2">
      <div class="compare-cell-header">
        <span class="compare-cell-label">Video 3</span>
        <button class="btn btn-outline btn-sm" data-slot="2">Load video…</button>
      </div>
      <div class="compare-video-wrap">
        <video id="video-2" muted playsinline></video>
        <div class="compare-video-placeholder">No video loaded</div>
      </div>
    </div>
    <div class="compare-cell" id="cell-3">
      <div class="compare-cell-header">
        <span class="compare-cell-label">Video 4</span>
        <button class="btn btn-outline btn-sm" data-slot="3">Load video…</button>
      </div>
      <div class="compare-video-wrap">
        <video id="video-3" muted playsinline></video>
        <div class="compare-video-placeholder">No video loaded</div>
      </div>
    </div>
  </div>

  <!-- Shared transport: ONE play/pause/scrub for every loaded video, see
       compare.js's sync engine (a "leader" slot -- the first loaded one --
       drives the scrub bar and the periodic drift correction of the
       others). -->
  <div class="transport-bar compare-transport">
    <button id="btn-restart" class="transport-btn" title="Restart all to 0:00">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="btn-play-pause" class="transport-btn transport-btn-main" title="Play/Pause all">
      <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
    <span id="compare-timecode" class="timecode">00:00 / 00:00</span>
    <div class="timeline-wrap compare-timeline-wrap">
      <div class="timeline-track" id="compare-timeline-track">
        <div class="timeline-progress" id="compare-timeline-progress"></div>
      </div>
    </div>
  </div>

</div>
<script src="compare.js"></script>
</body>
</html>
