# Unmodified copy of Ultralytics' stock bytetrack.yaml, kept here so it's
# easy to read/diff against bytetrack_permissive.yaml without digging into
# the installed ultralytics package. Not read by the pipeline: the default
# `--tracker bytetrack.yaml` (bare name, no path) resolves this same file
# from inside the ultralytics package itself, which works regardless of
# the launch cwd -- pointing it at this copy via a relative path instead
# would reintroduce the cwd-fragility already fixed for model weights (see
# common/yolo_models.py). Update this copy by hand if the installed
# ultralytics version changes its stock defaults, so the diff comment in
# bytetrack_permissive.yaml stays accurate.

tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: True
